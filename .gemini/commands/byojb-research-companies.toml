description = "BYOJB Stage 3 — LLM web-researches top-ranked companies (fetches careers/about) → reports + scores"

prompt = """
You are running the BYOJB **research-companies** mode (Stage 3: web research).

SUBSCRIPTION ONLY: do the web research and scoring YOURSELF with your own tools. Do NOT use a
`GEMINI_API_KEY`/`.env`, do NOT import `@google/generative-ai`, and do NOT write a script that calls
an LLM API. `llm-triage.mjs` is a deterministic helper only.

First read and follow `modes/research-companies.md` exactly. Also read `config/company_fit.yml` and
`config/profile.yml` (anti_targets, work_style_priorities, the remote-only + Canada constraints).

Loop:
0. Refresh the signals the queue is ordered by — SKIP THIS AND THE QUEUE IS STALE OR EMPTY:
   run `node score-postings.mjs && node company-aggregates.mjs`.
1. Get the work-list (companies whose OPEN POSTINGS score highest, not yet researched):
   run `node llm-triage.mjs --emit-research N` where N is the argument, default 20
   (add --needs-comp to target pay-data gaps).
   Ordered by best_posting_score. Most rows show llm_rank: null — expected, it's only a boost now.
2. For EACH company, web-research it (this is the point — read its OWN words):
   - READ LOCAL DATA FIRST: `data/posting-research.jsonl` already has this company's scraped JD
     bodies, locations, posted comp and extracted facets. Do NOT fetch ATS board URLs
     (jobs.ashbyhq.com, job-boards.greenhouse.io, jobs.lever.co) — they are client-rendered and
     return an empty shell. Spend fetches on the about/values/engineering pages only.
   - **WebSearch the careers/about URL first** ('<company> careers' / '<company> about') — don't
     guess `/careers` (~1/3 of guesses 404/redirect). Then fetch the about / values / engineering
     pages (more substance than the marketing careers landing page).
   - Verify **remote-Canada eligibility** specifically. Budget ~2-4 fetches/company.
3. Write TWO files per company (let KEY be the company key; FILE = KEY with ':' and '/' replaced by '-'):
   - **Objective research note** → `data/company-research/<FILE>.md` — COMPREHENSIVE dossier
     (everything you learned: what they do, mission + the FULL set of values/tone, size/stage/funding,
     locations, remote policy + Canada eligibility, eng/tech, notable/news, sample roles, sources).
     Capture all of it, not just rubric-relevant bits. NO rubric references.
   - **Personal fit verdict** → `data/company-fit/<FILE>.md` — qualitative only
     (Recommend: keep|skip|consider; Aligns; Concerns; Verdict). **Do NOT write a numeric 'Fit: X/5'
     in the verdict text.**
4. Record the score AFTER EACH COMPANY (not at the end of the batch): write `/tmp/research.json` =
   `[{'key': '...', 'llm_fit': <1-5>, 'fit_brief': 'data/company-fit/<FILE>.md', 'llm_reason': '<short>', 'company_type': '<optional>'}]`
   then run `node llm-triage.mjs --apply-append /tmp/research.json`.
   NOT OPTIONAL: the queue filters on llm_fit == null, so an unrecorded company re-emits at the head
   forever. --apply-append checkpoints incrementally, so a dropped session loses at most one company.
   If a company CANNOT be researched: `node llm-triage.mjs --record-fail <key> "<reason>"` so it backs
   off instead of jamming the queue head. If the pages reveal a staffing/consulting/outsourcing firm,
   put company_type in the payload and write no fit note.
5. **Comp & levels** (steps 2b/2c in the mode file): while you have the company's pages open, look
   for what it pays. **`title_family` and `ladder_level` MUST be copied verbatim from a `comp_slots`
   entry in the work-list — never classified by hand; a band filed elsewhere is unreachable and the
   work is wasted. Prefer slots with needs_comp: true.** Look at first-party/public-record sources:
   the company's own careers / pay-transparency / compensation-philosophy page, a live JD from a
   transparency jurisdiction (CO/NY/WA/CA/IL), a public levels handbook, a public filing.
   Assume comp aggregators (levels.fyi, Glassdoor, Blind, Payscale) are unreadable and don't spend
   fetches on them; if you do end up with a number from one, cite it accurately rather than
   misattributing it. **Never store a market/regional wage figure** — a band must belong to a
   specific company and role family, or it is not written at all.
   Where nothing citable exists, you MAY give your own best estimate from training knowledge, tagged
   `source:"llm_prior"`, `derivation:"estimated"`, `confidence:"low"`, `sample_size:0`, with your
   `model` id and a plain-words `method`. Use a range wide enough to reflect real uncertainty, and
   ABSTAIN for companies you don't genuinely recognize.
   Write `/tmp/company-comp.json` and run `node llm-triage.mjs --apply-comp /tmp/company-comp.json`
   (rows are validated; bad ones are rejected with a reason).
6. **Do NOT decide keep/skip** — that's the user's job in the decision console. When done, print a
   table: Company | llm_fit | 1-line why | report path.

Skip any company whose company_type is consulting/outsourcing/staffing (landscape-only).
Stage 4 (keep/skip) happens in the web console — there is no decide.mjs.

Arguments: {{args}}
  - a number = how many companies to research (default 20)
  - the word `comp` = PAY-GAP mode: use `node llm-triage.mjs --emit-research 20 --needs-comp` as the
    work-list instead, targeting only companies whose relevant open roles state no pay and have no
    band on record. Everything else in the loop is unchanged.
"""
