<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Postings — BYOJB</title>
<style>
  :root{--bg:#0f1020;--card:#1a1c33;--ink:#e8e9f3;--mut:#9aa0c0;--line:#2a2d4a;--accent:#7c8cff;--good:#3ec98a;--bad:#e0556e;--warn:#e0b341;}
  *{box-sizing:border-box;} body{margin:0;font:14px/1.5 -apple-system,system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--ink);}
  header{padding:.8rem 1.25rem;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:1rem;flex-wrap:wrap;}
  header h1{font-size:1.05rem;margin:0;} header a.nav{color:var(--accent);text-decoration:none;font-size:.9rem;margin:0 .5rem;}
  .seg{display:flex;gap:.3rem;}
  .seg a{background:none;border:1px solid var(--line);color:var(--ink);padding:.35rem .8rem;border-radius:8px;cursor:pointer;font-size:.85rem;text-decoration:none;}
  .seg a.active{background:var(--accent);border-color:var(--accent);color:#0b0c18;font-weight:600;}
  .counts{color:var(--mut);font-size:.82rem;margin-left:auto;}
  .wrap{display:grid;grid-template-columns:260px 1fr;gap:1rem;padding:1rem 1.25rem;align-items:start;}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;}
  .pad{padding:.9rem 1rem;} h2.lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:0 0 .7rem;}
  input,select,textarea{background:#0c0d1c;border:1px solid var(--line);color:var(--ink);border-radius:7px;font:inherit;padding:.4rem .5rem;}
  input[type=search]{width:100%;} .ctrls{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;padding:.7rem;border-bottom:1px solid var(--line);}
  .ctrls select{font-size:.8rem;} label.chk{font-size:.76rem;color:var(--mut);display:flex;align-items:center;gap:.3rem;}
  .dim{margin-bottom:.6rem;} .dim .r{display:flex;justify-content:space-between;font-size:.76rem;margin-bottom:.15rem;}
  .dim input[type=range]{width:100%;} .dim small{color:var(--mut);}
  table{width:100%;border-collapse:collapse;font-size:.84rem;} th,td{text-align:left;padding:.45rem .55rem;border-bottom:1px solid var(--line);vertical-align:top;}
  th{color:var(--mut);font-weight:600;cursor:pointer;white-space:nowrap;} tr:hover td{background:#191b30;cursor:pointer;}
  .badge{font-weight:700;font-variant-numeric:tabular-nums;border-radius:6px;padding:.1rem .35rem;font-size:.82rem;}
  .b-hi{color:#0b0c18;background:var(--good);} .b-mid{color:#0b0c18;background:var(--warn);} .b-lo{background:#23264a;color:var(--mut);}
  .chip{font-size:.66rem;padding:.06rem .4rem;border-radius:99px;background:#23264a;color:var(--mut);margin:0 .15rem .15rem 0;display:inline-block;}
  /* Technology chips coloured by rubric classification, so a stack score is self-explaining. */
  .chip.tk-love{background:rgba(62,201,138,.18);color:var(--good);}
  .chip.tk-ok{background:rgba(124,140,255,.16);color:var(--accent);}
  .chip.tk-avoid{background:rgba(224,85,110,.2);color:var(--bad);font-weight:600;}
  .chip.tk-unk{background:transparent;color:var(--mut);border:1px dashed var(--line);cursor:pointer;}
  .chip.tk-unk:hover{border-color:var(--accent);color:var(--accent);}
  .chip.tk-unk b{margin-left:.25rem;opacity:.6;}
  .pill{font-size:.68rem;padding:.08rem .45rem;border-radius:99px;background:#23264a;color:var(--mut);}
  .dec{font-size:.68rem;padding:.08rem .4rem;border-radius:6px;} .dec.shortlist,.dec.keep{background:rgba(62,201,138,.18);color:var(--good);} .dec.skip{background:rgba(224,85,110,.18);color:var(--bad);} .dec.applied{background:rgba(124,140,255,.18);color:var(--accent);}
  .cvet{font-size:.66rem;padding:.08rem .4rem;border-radius:6px;cursor:pointer;background:rgba(124,141,181,.16);color:var(--accent);border:1px dashed var(--accent);} .cvet:hover{background:rgba(124,141,181,.3);}
  /* researched-but-undecided: solid border (work done) vs .cvet's dashed (nothing known yet) */
  .cres{font-size:.66rem;padding:.08rem .4rem;border-radius:6px;cursor:pointer;background:rgba(124,140,255,.14);color:var(--accent);border:1px solid var(--accent);} .cres:hover{background:rgba(124,140,255,.28);}
  .st{font-size:.66rem;padding:.06rem .4rem;border-radius:99px;background:rgba(124,140,255,.18);color:var(--accent);}
  .hx{opacity:.45;} .hx td{text-decoration:line-through dotted rgba(224,85,110,.4);}
  th.selcol,td.selcol{width:1.6rem;text-align:center;padding-left:.4rem;padding-right:.2rem;cursor:default;} td.selcol input,th.selcol input{cursor:pointer;}
  .row-excl{color:var(--bad);font-size:.66rem;}
  .btn{border:1px solid var(--line);background:#23264a;color:var(--ink);padding:.4rem .75rem;border-radius:8px;cursor:pointer;font-size:.83rem;}
  .btn:hover{border-color:var(--accent);} .btn.good{background:var(--good);color:#0b0c18;border-color:var(--good);font-weight:600;} .btn.bad{background:var(--bad);color:#fff;border-color:var(--bad);font-weight:600;} .btn.applied{background:var(--accent);color:#0b0c18;border-color:var(--accent);font-weight:600;} .btn.sm{padding:.25rem .55rem;font-size:.78rem;}
  .toast{position:fixed;bottom:1rem;right:1rem;background:var(--good);color:#0b0c18;padding:.5rem .9rem;border-radius:8px;font-weight:600;opacity:0;transition:.2s;} .toast.show{opacity:1;}
  .act-btns{display:flex;gap:.3rem;align-items:center;}
  .btn-sl{border-color:rgba(62,201,138,0.4)!important;color:var(--good)!important;}
  .btn-sl:hover{background:rgba(62,201,138,0.15)!important;}
  .btn-ap{border-color:rgba(124,140,255,0.4)!important;color:var(--accent)!important;}
  .btn-ap:hover{background:rgba(124,140,255,0.15)!important;}
  .btn-sk{border-color:rgba(224,85,110,0.4)!important;color:var(--bad)!important;}
  .btn-sk:hover{background:rgba(224,85,110,0.15)!important;}
  .badge-today{background:rgba(62,201,138,.18);color:var(--good);border:1px solid rgba(62,201,138,.3);font-size:.7rem;padding:.08rem .35rem;border-radius:6px;font-weight:600;margin-left:.4rem;display:inline-block;white-space:nowrap;}
  .badge-week{background:rgba(124,140,255,.18);color:var(--accent);border:1px solid rgba(124,140,255,.3);font-size:.7rem;padding:.08rem .35rem;border-radius:6px;font-weight:600;margin-left:.4rem;display:inline-block;white-space:nowrap;}
  .badge-date{font-size:.68rem;padding:.08rem .45rem;border-radius:99px;background:#23264a;color:var(--mut);margin-left:.4rem;display:inline-block;white-space:nowrap;cursor:help;}
</style>
</head>
<body>
<script src="/conn.js"></script>
<header>
  <h1>BYOJB</h1>
  <div class="seg"><a href="/postings" class="active">Postings</a><a href="/companies">Companies</a><a href="/outreach">Outreach</a><a href="/plan">Plan</a><a href="/contacts">Contacts</a><a href="/applications">Applications</a><a href="/vocabulary">Vocabulary</a></div>
  <span class="counts" id="counts">loading…</span>
</header>

<div class="wrap">
  <aside class="panel pad">
    <h2 class="lbl">Rubric weights (live)</h2>
    <div id="sliders"></div>
    <button class="btn sm" id="resetW" style="margin-top:.3rem">reset weights</button>
    <h2 class="lbl" style="margin-top:1rem">Filters</h2>
    <label class="chk"><input type="checkbox" id="liveOnly" checked> live only</label>
    <label class="chk"><input type="checkbox" id="showExcl"> show hard-excluded</label>
    <label class="chk"><input type="checkbox" id="resOnly"> researched only</label>
    <label class="chk"><input type="checkbox" id="hideCapped" checked> hide capped companies</label>
    <label class="chk"><input type="checkbox" id="hideApplied" checked> hide applied</label>
    <label class="chk"><input type="checkbox" id="hideDupes" checked> hide duplicate listings</label>
    <div style="margin-top:.5rem"><small style="color:var(--mut)">comp evidence</small>
      <select id="compEv" style="width:100%;font-size:.8rem;margin-top:.15rem">
        <option value="any">any (incl. estimates)</option>
        <option value="noguess">no model guesses</option>
        <option value="cited">cited only (listed or company-stated)</option>
        <option value="listed">listed on the posting only</option>
      </select></div>
    <div style="margin-top:.5rem"><small style="color:var(--mut)">min score <span id="minLbl">0</span></small><input type="range" id="minScore" min="0" max="5" step="0.5" value="0" style="width:100%"></div>
    <div style="margin-top:.5rem"><small style="color:var(--mut)">max age: <span id="ageLbl">any</span> days</small><input type="range" id="maxAge" min="1" max="31" step="1" value="31" style="width:100%"></div>
    <div style="margin-top:.5rem"><small style="color:var(--mut)">age penalty: <span id="penaltyLbl">0.10</span> pts/day</small><input type="range" id="agePenalty" min="0" max="1" step="0.05" value="0.10" style="width:100%"></div>
    <label class="chk" style="margin-top:.3rem"><input type="checkbox" id="hideOlder"> hide older (don't de-rank)</label>
  </aside>
  <div>
    <div class="panel pad" id="funnel" style="margin-bottom:1rem;display:none"></div>
    <div class="panel">
      <div class="ctrls">
        <input type="search" id="q" placeholder="search company / title / reason…" style="flex:1;min-width:160px">
        <select id="fLang"><option value="">any language</option></select>
        <select id="fSen"><option value="">any seniority</option></select>
        <select id="fRemote"><option value="">any remote</option></select>
        <select id="fGeo"><option value="">any geo</option></select>
        <select id="fDec"><option value="">any decision</option><option selected>undecided</option><option>shortlist</option><option>skip</option><option>applied</option></select>
      </div>
      <div class="pad" style="padding:.4rem 1rem;display:flex;align-items:center;gap:.7rem;flex-wrap:wrap">
        <span id="pcount" style="color:var(--mut);font-size:.8rem"></span>
        <span style="flex:1"></span>
        <span id="selCount" style="color:var(--mut);font-size:.8rem"></span>
        <a href="#" id="cmpClear" class="cvet" style="display:none">clear</a>
        <button class="btn sm" id="cmpBtn" disabled>Compare</button>
      </div>
      <div id="ptable"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>(s??'').toString().replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const bcls=v=>v==null?'b-lo':v>=4?'b-hi':v>=3?'b-mid':'b-lo';
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1300);}
const post=(p,b)=>fetch(p,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)});
async function setDecision(key, decision){
  const res = await post('/api/posting/decision', { key, decision });
  if (res.ok) {
    toast(decision === 'shortlist' ? 'shortlisted' : decision === 'applied' ? 'applied' : decision === 'skip' ? 'skipped' : 'reset');
    const d = await (await fetch('/api/postings')).json();
    ROWS = d.rows || [];
    FUNNEL = d.funnel || {};
    renderCounts();
    renderFunnel();
    renderPostings();
  } else {
    toast('Error updating decision');
  }
}

// Lever C — just-in-time vetting: jump from a posting straight to its company's vetting drawer.
function vetCompany(key){ if(!key) return; window.location.href='/companies?vet='+encodeURIComponent(key); }

// ==================== POSTINGS ====================
let RUBRIC={dimensions:[]}, ROWS=[], WEIGHTS={}, psort={key:'display',dir:-1}, FUNNEL={}, WORKFLOW={max_open_per_company:3,apply_floor:3.5};
let SELECTED=new Set();   // posting keys ticked for comparison (persisted)
let SERVER_TODAY = '';

function getAgeInDays(r, todayStr) {
  let dateStr = r.date_posted;
  let usingFallback = false;
  if (dateStr && /^\d{4}-\d{2}-\d{2}/.test(dateStr)) {
    dateStr = dateStr.slice(0, 10);
  } else {
    dateStr = r.first_seen;
    usingFallback = true;
  }
  if (!dateStr) {
    console.error(`[BYOJB] No date available for posting: ${r.key}`);
    return 999;
  }
  
  const parseDate = (s) => {
    const parts = s.slice(0, 10).split('-');
    return new Date(parts[0], parts[1] - 1, parts[2]);
  };
  
  try {
    const pDate = parseDate(dateStr);
    const tDate = parseDate(todayStr);
    if (isNaN(pDate.getTime()) || isNaN(tDate.getTime())) {
      throw new Error("Invalid Date parsed");
    }
    const diffTime = tDate - pDate;
    const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
    return Math.max(0, diffDays);
  } catch (e) {
    console.error(`[BYOJB] Failed to parse age for posting: ${r.key}. date_posted='${r.date_posted}', first_seen='${r.first_seen}', usingFallback=${usingFallback}. Error:`, e);
    return 999;
  }
}

function getDateInfo(r) {
  if (r.date_posted && /^\d{4}-\d{2}-\d{2}/.test(r.date_posted)) {
    return { date: r.date_posted.slice(0, 10), isFallback: false };
  }
  if (r.first_seen && /^\d{4}-\d{2}-\d{2}/.test(r.first_seen)) {
    return { date: r.first_seen.slice(0, 10), isFallback: true };
  }
  console.error(`[BYOJB] No valid date found for posting: ${r.key}. date_posted='${r.date_posted}', first_seen='${r.first_seen}'`);
  return { date: 'unknown', isFallback: true };
}
const LEVEL_LADDER=['junior','mid','mid-senior','senior','staff','principal'];
let DESIRED_LEVEL='senior';
function levelScore(r){
  const di=LEVEL_LADDER.indexOf((DESIRED_LEVEL||'').toLowerCase()); if(di<0) return r.dim_scores?(r.dim_scores.level??null):null;
  const sen=(r.seniority||'').toLowerCase(); let li=LEVEL_LADDER.indexOf(sen);
  if(li<0&&sen==='manager') return 1;
  if(li<0&&r.yoe_min!=null){ li=r.yoe_min>=8?LEVEL_LADDER.indexOf('staff'):r.yoe_min>=5?LEVEL_LADDER.indexOf('senior'):r.yoe_min>=3?LEVEL_LADDER.indexOf('mid-senior'):LEVEL_LADDER.indexOf('mid'); }
  if(li<0) return null;
  return Math.max(1,5-Math.abs(li-di));
}
function effDims(r){ if(!r.dim_scores) return r.dim_scores; if(!('level' in r.dim_scores)) return r.dim_scores; return {...r.dim_scores, level:levelScore(r)}; }

const LS_KEY='byojb.postings.v1';
const LS_KEY_FALLBACK='careerops.postings.v1';
function saveState(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify({
    weights:WEIGHTS, psort, desired_level:DESIRED_LEVEL, selected:[...SELECTED],
    f:{ q:$('#q').value, fLang:$('#fLang').value, fSen:$('#fSen').value, fRemote:$('#fRemote').value,
        fGeo:$('#fGeo').value, fDec:$('#fDec').value, liveOnly:$('#liveOnly').checked,
        showExcl:$('#showExcl').checked, resOnly:$('#resOnly').checked, minScore:$('#minScore').value,
        hideCapped:$('#hideCapped').checked, hideApplied:$('#hideApplied').checked, hideDupes:$('#hideDupes').checked,
        maxAge:$('#maxAge').value, agePenalty:$('#agePenalty').value, hideOlder:$('#hideOlder').checked,
        compEv:$('#compEv').value },
  })); }catch{}
}
function loadState(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)||localStorage.getItem(LS_KEY_FALLBACK)||'null'); }catch{ return null; } }
function restoreFilters(f){
  if(!f) return;
  const set=(id,v)=>{ const e=$('#'+id); if(e&&v!=null&&v!=='') e.value=v; };
  set('q',f.q); set('fLang',f.fLang); set('fSen',f.fSen); set('fRemote',f.fRemote); set('fGeo',f.fGeo); set('fDec',f.fDec);
  if(f.liveOnly!=null)$('#liveOnly').checked=f.liveOnly;
  if(f.showExcl!=null)$('#showExcl').checked=f.showExcl;
  if(f.resOnly!=null)$('#resOnly').checked=f.resOnly;
  if(f.hideCapped!=null)$('#hideCapped').checked=f.hideCapped;
  if(f.hideApplied!=null)$('#hideApplied').checked=f.hideApplied;
  if(f.hideDupes!=null)$('#hideDupes').checked=f.hideDupes;
  if(f.minScore!=null){ $('#minScore').value=f.minScore; $('#minLbl').textContent=f.minScore; }
  if(f.maxAge!=null){ $('#maxAge').value=f.maxAge; $('#ageLbl').textContent=f.maxAge === '31' ? 'any' : f.maxAge; }
  if(f.agePenalty!=null){ $('#agePenalty').value=f.agePenalty; $('#penaltyLbl').textContent=Number(f.agePenalty).toFixed(2); }
  if(f.hideOlder!=null)$('#hideOlder').checked=f.hideOlder;
}

function weightedScore(dim){ if(!dim) return null; let w=0,a=0; for(const id in WEIGHTS){const s=dim[id]; if(s!=null){w+=WEIGHTS[id];a+=WEIGHTS[id]*s;}} return w?+(a/w).toFixed(2):null; }
function liveScore(r){ if(r.manual_score!=null) return r.manual_score; const ws=weightedScore(effDims(r)); if(ws!=null) return ws; return r.llm_rank!=null?r.llm_rank:null; }

async function loadPostings(){
  const d=await (await fetch('/api/postings')).json();
  RUBRIC=d.rubric||{dimensions:[]}; ROWS=d.rows||[]; FUNNEL=d.funnel||{}; WORKFLOW=d.workflow||WORKFLOW;
  SERVER_TODAY=d.today || new Date().toISOString().slice(0, 10);
  WEIGHTS={}; for(const dm of RUBRIC.dimensions) WEIGHTS[dm.id||dm.name]=+dm.weight||0;
  const st=loadState();
  if(st&&st.weights){ for(const id in WEIGHTS) if(st.weights[id]!=null) WEIGHTS[id]=+st.weights[id]; }
  if(st&&st.psort&&st.psort.key) psort=st.psort;
  if(st&&Array.isArray(st.selected)) SELECTED=new Set(st.selected);
  DESIRED_LEVEL=(st&&st.desired_level)||(RUBRIC.preferences&&RUBRIC.preferences.desired_level)||'senior';
  renderSliders(); fillFacetFilters(); restoreFilters(st&&st.f);
  const qParam = new URLSearchParams(window.location.search).get('q');
  if (qParam !== null) $('#q').value = qParam;
  renderCounts(); renderFunnel(); renderPostings();
}
function renderFunnel(){
  const el=$('#funnel'); if(!el) return;
  const f=FUNNEL||{}; const low=(f.actionable??99)<5;
  const cell=(n,l)=>`<span style="margin-right:1rem"><b style="font-size:1.05rem">${n??'·'}</b> <span style="color:var(--mut);font-size:.78rem">${l}</span></span>`;
  let h=`<h2 class="lbl">Apply queue</h2><div style="margin:.2rem 0 .5rem">${cell(f.actionable,'actionable')}${cell(f.live,'live')}${cell(f.open_apps,'open apps')}${cell(f.capped_companies,'capped cos')}${f.companies_pending_vet?cell(f.companies_pending_vet,'cos to vet'):''}</div>`;
  if(f.companies_pending_vet){
    // "unvetted" was wrong for the 778 companies that HAVE been researched (llm_fit set) but are
    // deliberately left decision='undecided' — the keep/skip call is the user's. They are awaiting
    // a decision, not awaiting work.
    h+=`<div style="font-size:.82rem;border-top:1px solid var(--line);padding-top:.5rem">🏷️ <b>${f.companies_pending_vet} ${f.companies_pending_vet===1?'company has':'companies have'} a shortlisted posting and no keep/skip decision yet.</b> Deciding folds company fit into the score → <code>node llm-triage-jobs.mjs --vet-queue</code></div>`;
  }
  if(low){
    h+=`<div style="font-size:.82rem;border-top:1px solid var(--line);padding-top:.5rem">⚠️ <b>Apply queue is running low.</b> Next steps:<ul style="margin:.3rem 0 0;padding-left:1.1rem;color:var(--mut)">`;
    h+=`<li>${f.companies_kept_unscanned||0} kept companies not yet scanned, ${f.companies_to_research||0} researched & undecided → decide in <a href="/companies">Companies</a>, then <code>node generate-watchlist.mjs &amp;&amp; node scan.mjs &amp;&amp; node rank-postings.mjs</code></li>`;
    h+=`<li>or lower the min-score floor (slider) to surface decent-but-not-ideal postings</li></ul></div>`;
  }
  el.innerHTML=h; el.style.display='block';
}
function renderSliders(){
  $('#sliders').innerHTML=RUBRIC.dimensions.map(d=>{
    const id=d.id||d.name;
    const lvlPick=d.compute==='level'?`<select data-lvlsel="1" style="width:100%;font-size:.76rem;margin:.1rem 0 .3rem">${LEVEL_LADDER.map(l=>`<option${l===DESIRED_LEVEL?' selected':''}>${l}</option>`).join('')}</select>`:'';
    return `<div class="dim"><div class="r"><span title="${esc(d.guidance||'')}">${esc(d.name)}${d.compute?'':' <small>·llm</small>'}</span><span id="w-${id}">${WEIGHTS[id]}</span></div>${lvlPick}<input type="range" min="0" max="50" step="1" value="${WEIGHTS[id]}" data-id="${id}"></div>`;
  }).join('');
  $('#sliders').querySelectorAll('input[type=range]').forEach(el=>el.oninput=()=>{WEIGHTS[el.dataset.id]=+el.value;$('#w-'+el.dataset.id).textContent=el.value;renderPostings();saveState();});
  $('#sliders').querySelectorAll('select[data-lvlsel]').forEach(el=>el.onchange=()=>{DESIRED_LEVEL=el.value;renderPostings();saveState();});
}
$('#resetW').onclick=()=>{for(const d of RUBRIC.dimensions){const id=d.id||d.name;WEIGHTS[id]=+d.weight||0;}renderSliders();renderPostings();saveState();};

function fillFacetFilters(){
  // Fold case variants into ONE option. Extractors write whatever the JD wrote, so the corpus holds
  // Python/python, TypeScript/typescript/Typescript, Go/go, C#/c# — 15 such collisions. Each became
  // a separate dropdown entry matching only its own spelling, so choosing "TypeScript" silently
  // dropped the 22 postings written "typescript". The filter compares case-insensitively for the
  // same reason; the label shown is the most common spelling, which is the one people look for.
  const langCount=new Map(),sen=new Set(),rem=new Set(),geo=new Set();
  for(const r of ROWS){
    for(const l of (r.languages||[])){
      const k=String(l).toLowerCase();
      const e=langCount.get(k)||{n:0,forms:new Map()};
      e.n++; e.forms.set(l,(e.forms.get(l)||0)+1);
      langCount.set(k,e);
    }
    if(r.seniority)sen.add(r.seniority);if(r.remote_policy)rem.add(r.remote_policy);if(r.geo_eligibility)geo.add(r.geo_eligibility);
  }
  const langs=new Set([...langCount.values()].map(e=>[...e.forms.entries()].sort((a,b)=>b[1]-a[1])[0][0]));
  const opt=(s,sel)=>[...s].sort().map(v=>`<option ${sel?'':''}>${esc(v)}</option>`).join('');
  $('#fLang').innerHTML='<option value="">any language</option>'+opt(langs);
  $('#fSen').innerHTML='<option value="">any seniority</option>'+opt(sen);
  $('#fRemote').innerHTML='<option value="">any remote</option>'+opt(rem);
  $('#fGeo').innerHTML='<option value="">any geo</option>'+opt(geo);
}
function renderCounts(){
  const live=ROWS.filter(r=>r.live).length,sl=ROWS.filter(r=>r.decision==='shortlist').length,sk=ROWS.filter(r=>r.decision==='skip').length,ap=ROWS.filter(r=>r.decision==='applied').length,rs=ROWS.filter(r=>r.researched).length;
  $('#counts').textContent=`${ROWS.length} postings · ${live} live · ${rs} facet-extracted · ${sl} shortlisted · ${ap} applied · ${sk} skipped`;
}
function pfiltered(){
  const q=$('#q').value.trim().toLowerCase(),lang=$('#fLang').value,sen=$('#fSen').value,rem=$('#fRemote').value,geo=$('#fGeo').value,dec=$('#fDec').value;
  const minS=+$('#minScore').value,liveOnly=$('#liveOnly').checked,showExcl=$('#showExcl').checked,resOnly=$('#resOnly').checked;
  const hideCapped=$('#hideCapped').checked,hideApplied=$('#hideApplied').checked,hideDupes=$('#hideDupes').checked;
  const compEv=$('#compEv').value;
  const maxAge=+$('#maxAge').value;
  const agePenalty=+$('#agePenalty').value;
  const hideOlder=$('#hideOlder').checked;

  let list=ROWS.map(r=>{
    const score = liveScore(r);
    const age = getAgeInDays(r, SERVER_TODAY);
    let penalty = 0;
    let finalScore = score;
    if (agePenalty > 0 && age > 0) {
      penalty = age * agePenalty; // independent of the max-age filter
      if (finalScore != null) {
        finalScore = Math.max(0, finalScore - penalty);
      }
    }
    return {...r, _s: finalScore, _orig_s: score, _penalty: penalty, _age: age};
  });

  list=list.filter(r=>r.company_decision!=='skip'); // always hide postings from skipped companies
  if(liveOnly) list=list.filter(r=>r.live);
  if(!showExcl) list=list.filter(r=>!r.hard_excluded);
  if(resOnly) list=list.filter(r=>r.researched);
  if(hideCapped) list=list.filter(r=>!r.capped);
  // A per-city republication of one requisition is not a second opportunity. Hidden by default;
  // the canonical row shows how many listings it stands for.
  if(hideDupes) list=list.filter(r=>!r.dup_of);
  if(hideApplied) list=list.filter(r=>!r.applied);
  // Comp evidence floor. Only filters rows that HAVE a comp figure of the excluded kind — a
  // posting with no comp information at all is unaffected (that's the `min score` filter's job).
  if(compEv==='noguess') list=list.filter(r=>r.comp_source!=='company_estimated');
  else if(compEv==='cited') list=list.filter(r=>!r.comp_source||['listed','scanned','company_direct'].includes(r.comp_source));
  else if(compEv==='listed') list=list.filter(r=>!r.comp_source||['listed','scanned'].includes(r.comp_source));
  // Case-insensitive: the dropdown shows one folded option per language (see fillFacetFilters),
  // so the comparison has to fold too or the folded-away spellings would never match.
  if(lang){const lk=lang.toLowerCase();list=list.filter(r=>(r.languages||[]).some(l=>String(l).toLowerCase()===lk));}
  if(sen) list=list.filter(r=>r.seniority===sen);
  if(rem) list=list.filter(r=>r.remote_policy===rem);
  if(geo) list=list.filter(r=>r.geo_eligibility===geo);
  if(dec) list=list.filter(r=>r.decision===dec);
  
  if (maxAge < 31 && hideOlder) {
    list=list.filter(r=>r._age<=maxAge);
  }

  if(minS>0) list=list.filter(r=>(r._s??-1)>=minS);
  if(q) list=list.filter(r=>(r.company+r.title+r.reason+(r.languages||[]).join()+(r.technologies||[]).join()).toLowerCase().includes(q));
  const k=psort.key,dir=psort.dir;
  const numeric=['display','yoe_min','relevance_score','computed_score'].includes(k);
  list.sort((a,b)=>{
    const av=k==='display'?a._s:a[k], bv=k==='display'?b._s:b[k];
    if(numeric) return ((av??-1)-(bv??-1))*dir;
    return String(av??'').localeCompare(String(bv??''))*dir;
  });
  return list;
}
function comp(c){ if(!c) return ''; if(typeof c!=='object')return String(c); const f=n=>n!=null?('$'+Math.round(n/1000)+'k'):''; const r=[f(c.min),f(c.max)].filter(Boolean).join('–'); return r?(r+(c.currency?(' '+c.currency):'')):''; }
// Four visually DISTINCT states, because a listed number and an estimated one must never look
// alike: listed (plain, as before) · company-direct ("$185k co.") · derived ("~$185k est") ·
// model prior ("?$185k guess", dotted + faded). The estimate is drawn from `comp_imputed`,
// a separate field from `comp`, so it can never leak into the listed-comp column.
function compCell(r){
  const listed=comp(r.comp);
  if(listed) return esc(listed);
  const b=r.comp_imputed; if(!b) return '·';
  const val=b.mid??b.max??b.min; if(val==null) return '·';
  const s='$'+Math.round(val/1000)+'k'+(b.currency?(' '+b.currency):'');
  const tip=[`${b.derivation} — ${b.source}`,b.method||'',`${b.title_family} / ${b.ladder_level||'?'}`,
    `confidence ${b.confidence}, n=${b.sample_size}`,b.as_of?`as of ${b.as_of}`:'',b.model?`model ${b.model}`:'',
    'NOT listed on this posting — from this company’s pay band'].filter(Boolean).join('\n');
  if(r.comp_source==='company_direct')
    return `<span title="${esc(tip)}" style="color:var(--mut)">${esc(s)} <span style="font-size:.7rem">co.</span></span>`;
  if(r.comp_source==='company_estimated')
    return `<span title="${esc(tip)}" style="color:var(--mut);opacity:.65;font-style:italic;border-bottom:1px dotted var(--mut)">?${esc(s)}</span>`;
  return `<span title="${esc(tip)}" style="color:var(--mut);font-style:italic">~${esc(s)} <span style="font-size:.7rem">est</span></span>`;
}
function th(k,l){const ar=psort.key===k?(psort.dir<0?' ▼':' ▲'):'';return `<th data-k="${k}">${l}${ar}</th>`;}
function pipeChip(r){
  const S=r.status;
  if(S){ const cls=/offer/i.test(S)?'dec keep':/reject|discard/i.test(S)?'dec skip':'st'; return `<span class="${cls}" title="from Applications tracker">${esc(S)}</span>`; }
  if(r.decision==='shortlist') return '<span class="dec shortlist">shortlist</span>';
  if(r.decision==='applied') return '<span class="dec applied">applied</span>';
  if(r.decision==='skip') return '<span class="dec skip">skip</span>';
  return '·';
}
function companyLink(r){
  return `<a href="/companies?vet=${encodeURIComponent(r.company_key||r.company)}" style="color:var(--accent);text-decoration:none;cursor:pointer;">${esc(r.company)}</a>`;
}
function companyBadge(r){
  const d=r.company_decision;
  if(d==='keep') return ` <span class="dec keep" title="vetted company — fit ${r.company_fit??'?'}/5 (boosts the score)">✓ co ${r.company_fit!=null?r.company_fit:'kept'}</span>`;
  if(d==='skip') return ` <span class="dec skip" title="company marked skip">co skip</span>`;
  // Stage-3 research sets llm_fit but deliberately leaves decision='undecided' — the keep/skip
  // call is the user's, not the pipeline's. Keying the badge on decision alone therefore rendered
  // every researched company as "vet co", i.e. as though no work had been done on it. Show the
  // researched fit instead, and still make it clickable so the decision is one click away.
  if(r.company_fit!=null) return ` <span class="cres" data-vet="${esc(r.company_key||'')}" title="researched — fit ${r.company_fit}/5; click to keep or skip">◆ co ${r.company_fit}</span>`;
  return ` <span class="cvet" data-vet="${esc(r.company_key||'')}" title="company not yet vetted — click to vet it">vet co</span>`;
}
function renderPostings(){
  const list=pfiltered();
  $('#pcount').textContent=`${list.length} shown`;
  let h='<table><thead><tr><th class="selcol"><input type="checkbox" id="selAll" title="select all shown"></th>'+th('display','Score')+th('company','Company')+th('title','Title')+th('seniority','Lvl')+th('yoe_min','YOE')+'<th>Stack</th><th>Comp</th><th>Remote/Geo</th>'+th('culture','Culture')+th('status','Pipeline')+'<th>Actions</th></tr></thead><tbody>';
  for(const r of list){
    // Colour each technology by how the RUBRIC classified it, not just by name. An avoid match is
    // why a stack scored 1.5; an unrecognised term is a gap in the preference list that silently
    // contributes nothing. Both were previously invisible — the Stripe ML Infrastructure case was
    // only found by reading one row's facets by hand.
    const sm=r.stack_match||{love:[],ok:[],avoid:[],neutral:[],unrecognized:[]};
    const chip=(x,cls,title)=>`<span class="chip ${cls}" title="${esc(title)}">${esc(x)}</span>`;
    const unknownChip=(x)=>`<span class="chip tk-unk" data-term="${esc(x)}" title="not in your rubric — click to classify">${esc(x)}<b>+</b></span>`;
    const stack=[
      ...sm.avoid.map(x=>chip(x,'tk-avoid','on your avoid list — caps this stack at 1.5')),
      ...sm.love.map(x=>chip(x,'tk-love','on your love list')),
      ...sm.ok.map(x=>chip(x,'tk-ok','on your ok list')),
      ...sm.unrecognized.slice(0,4).map(unknownChip),
    ].slice(0,7).join('');
    let actButtons = '';
    if (r.decision === 'shortlist') {
      actButtons = `<div class="act-btns">
        <button class="btn sm good act-btn" data-k="${esc(r.key)}" data-dec="undecided" title="Shortlisted. Click to undo.">Shortlisted ✓</button>
        <button class="btn sm act-btn" data-k="${esc(r.key)}" data-dec="skip">Skip</button>
      </div>`;
    } else if (r.decision === 'applied') {
      actButtons = `<span class="dec applied">Applied ✓</span>`;
    } else if (r.decision === 'skip') {
      actButtons = `<div class="act-btns">
        <button class="btn sm act-btn" data-k="${esc(r.key)}" data-dec="shortlist">Shortlist</button>
        <button class="btn sm bad act-btn" data-k="${esc(r.key)}" data-dec="undecided" title="Skipped. Click to undo.">Skipped ✕</button>
      </div>`;
    } else {
      actButtons = `<div class="act-btns">
        <button class="btn sm btn-sl act-btn" data-k="${esc(r.key)}" data-dec="shortlist">Shortlist</button>
        <button class="btn sm btn-sk act-btn" data-k="${esc(r.key)}" data-dec="skip">Skip</button>
      </div>`;
    }
    const hasPenalty = r._orig_s != null && r._penalty >= 0.5; // only flag a materially de-ranked posting
    const scoreTooltip = hasPenalty ? `title="Original score: ${r._orig_s.toFixed(1)} (penalized by -${r._penalty.toFixed(2)} due to age: ${r._age} days)"` : '';
    const penaltyIndicator = hasPenalty ? ` <span style="cursor:help;color:var(--warn);" title="De-ranked due to age: ${r._age} days (penalty -${r._penalty.toFixed(2)})">⏳</span>` : '';

    let ageBadge = '';
    if (r._age === 0) {
      ageBadge = ' <span class="badge-today">New Today</span>';
    } else if (r._age <= 7) {
      ageBadge = ' <span class="badge-week">New this Week</span>';
    }

    const dInfo = getDateInfo(r);
    const dateIcon = dInfo.isFallback ? '🔍' : '📅';
    const dateTooltip = dInfo.isFallback ? `First discovered by scan on ${dInfo.date}` : `Posted by company on ${dInfo.date}`;
    const datePill = dInfo.date !== 'unknown' ? ` <span class="badge-date" title="${dateTooltip}">${dateIcon} ${dInfo.date}</span>` : '';

    h+=`<tr class="${r.hard_excluded||r.capped?'hx':''}" data-k="${esc(r.key)}">
      <td class="selcol"><input type="checkbox" class="rsel" data-k="${esc(r.key)}"${SELECTED.has(r.key)?' checked':''}></td>
      <td ${scoreTooltip}><span class="badge ${bcls(r._s)}">${r._s!=null?r._s.toFixed(1):'·'}</span>${r.hard_excluded?' <span class="row-excl">⛔</span>':''}${penaltyIndicator}</td>
      <td>${companyLink(r)}${companyBadge(r)}${!r.live?' <span class="pill">expired</span>':''}${r.capped?` <span class="row-excl" title="${r.company_open_count} open applications">⛔ ${r.company_open_count} open</span>`:''}${r.applied?' <span class="st">applied</span>':''}${r.dup_count>1?` <span class="pill" title="this opening is listed ${r.dup_count} times, once per location">×${r.dup_count} listings</span>`:''}${r.dup_of?' <span class="pill" title="duplicate of another listing of the same role">dup</span>':''}</td>
      <td>${esc(r.title)}${ageBadge}${datePill}</td><td>${esc(r.seniority||'·')}</td><td>${r.yoe_min!=null?esc(r.yoe_min+(r.yoe_max?'-'+r.yoe_max:'+')):'·'}</td>
      <td>${stack||'·'}</td><td>${compCell(r)}</td>
      <td>${esc(r.location||r.remote_policy||'·')}${r.geo_eligibility&&r.geo_eligibility!=='unclear'?` <span class="chip">${esc(r.geo_eligibility)}</span>`:''}</td>
      <td>${r.culture?`<span class="chip">${esc(r.culture)}</span>`:'·'}</td>
      <td>${pipeChip(r)}</td>
      <td>${actButtons}</td></tr>`;
  }
  h+='</tbody></table>';
  $('#ptable').innerHTML=list.length?h:'<div class="detail empty">no postings match</div>';
  $('#ptable').querySelectorAll('th[data-k]').forEach(el=>el.onclick=()=>{const k=el.dataset.k;if(psort.key===k)psort.dir*=-1;else psort={key:k,dir:k==='company'||k==='title'?1:-1};renderPostings();saveState();});
  $('#ptable').querySelectorAll('tr[data-k]').forEach(el=>el.onclick=(e)=>{if(e.target.closest('.selcol'))return;window.open('/posting?key='+encodeURIComponent(el.dataset.k),'_blank');});
  $('#ptable').querySelectorAll('.rsel').forEach(el=>el.onclick=(e)=>e.stopPropagation());
  $('#ptable').querySelectorAll('.rsel').forEach(el=>el.onchange=(e)=>{e.stopPropagation();if(el.checked)SELECTED.add(el.dataset.k);else SELECTED.delete(el.dataset.k);renderSelBar();saveState();});
  const selAll=$('#selAll'); if(selAll){selAll.onclick=(e)=>e.stopPropagation();selAll.onchange=()=>{const on=selAll.checked;for(const r of list){if(on)SELECTED.add(r.key);else SELECTED.delete(r.key);}renderPostings();saveState();};}
  $('#ptable').querySelectorAll('td:nth-child(3) a').forEach(el=>el.onclick=(e)=>e.stopPropagation());
  $('#ptable').querySelectorAll('.cvet,.cres').forEach(el=>el.onclick=(e)=>{e.stopPropagation();vetCompany(el.dataset.vet);});
  // Classify an unrecognised technology without leaving the queue. The preference lists are the
  // most under-maintained part of the rubric precisely because editing them means opening a file
  // away from the evidence; every chip here is a word a real posting used.
  $('#ptable').querySelectorAll('.chip.tk-unk').forEach(el=>el.onclick=async(e)=>{
    e.stopPropagation();
    const term=el.dataset.term;
    const list=prompt(`Classify "${term}" in your rubric:\n\n  love   — actively want this\n  ok     — fine\n  avoid  — dealbreaker (caps the stack at 1.5)\n  neutral— ignore it\n\nEnter one:`,'love');
    if(!list) return;
    if(!['love','ok','avoid','neutral'].includes(list)) return toast('unknown list: '+list);
    const res=await fetch('/api/rubric/technology',{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({term,list,group:'technologies'})});
    const j=await res.json();
    if(j.error) return toast('failed: '+j.error);
    toast(j.already?`"${term}" already in ${list}`:`added "${term}" → ${list}. Re-run score-postings.mjs`);
  });
  $('#ptable').querySelectorAll('.act-btn').forEach(el=>el.onclick=(e)=>{e.stopPropagation();setDecision(el.dataset.k, el.dataset.dec);});
  renderSelBar(list);
}
function renderSelBar(list){
  const n=SELECTED.size;
  $('#selCount').textContent=n?`${n} selected`:'';
  $('#cmpClear').style.display=n?'inline-block':'none';
  const btn=$('#cmpBtn'); btn.textContent=n>=2?`Compare (${n})`:'Compare'; btn.disabled=n<2;
  // keep the select-all box in sync with what's currently shown
  if(list){const all=list.length&&list.every(r=>SELECTED.has(r.key));const sa=$('#selAll');if(sa)sa.checked=all;}
}
['q','fLang','fSen','fRemote','fGeo','fDec','liveOnly','showExcl','resOnly','hideCapped','hideApplied','hideOlder','compEv'].forEach(id=>{const e=$('#'+id);const h=()=>{renderPostings();saveState();};e.oninput=h;e.onchange=h;});
$('#minScore').oninput=()=>{$('#minLbl').textContent=$('#minScore').value;renderPostings();saveState();};
$('#maxAge').oninput=()=>{
  const val = $('#maxAge').value;
  $('#ageLbl').textContent = val === '31' ? 'any' : val;
  renderPostings();
  saveState();
};
$('#agePenalty').oninput=()=>{
  const val = $('#agePenalty').value;
  $('#penaltyLbl').textContent = Number(val).toFixed(2);
  renderPostings();
  saveState();
};
$('#cmpBtn').onclick=()=>{ if(SELECTED.size<2) return; window.open('/compare?keys='+encodeURIComponent([...SELECTED].join('\n')),'_blank'); };
$('#cmpClear').onclick=(e)=>{e.preventDefault();SELECTED.clear();renderPostings();saveState();};

loadPostings();
</script>
