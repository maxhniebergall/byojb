<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Send plan — BYOJB</title>
<style>
  :root{--bg:#0f1020;--card:#1a1c33;--ink:#e8e9f3;--mut:#9aa0c0;--line:#2a2d4a;--accent:#7c8cff;--good:#3ec98a;--bad:#e0556e;--warn:#e0b341;}
  *{box-sizing:border-box;} body{margin:0;font:14px/1.5 -apple-system,system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--ink);}
  header{padding:.8rem 1.25rem;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:1rem;flex-wrap:wrap;}
  header h1{font-size:1.05rem;margin:0;}
  .seg{display:flex;gap:.3rem;}
  .seg a{background:none;border:1px solid var(--line);color:var(--ink);padding:.35rem .8rem;border-radius:8px;cursor:pointer;font-size:.85rem;text-decoration:none;}
  .seg a.active{background:var(--accent);border-color:var(--accent);color:#0b0c18;font-weight:600;}
  .wrap{padding:1rem 1.25rem;max-width:1000px;margin:0 auto;}
  .bar{color:var(--mut);font-size:.83rem;margin-bottom:.9rem;display:flex;gap:1rem;flex-wrap:wrap;align-items:center;}
  .day{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:1rem;overflow:hidden;}
  .day > h2{margin:0;padding:.6rem .9rem;font-size:.9rem;border-bottom:1px solid var(--line);display:flex;gap:.6rem;align-items:center;
    background:rgba(124,140,255,.05);}
  .day.today > h2{background:rgba(62,201,138,.10);} .day.overdue > h2{background:rgba(224,85,110,.10);}
  .pill{font-size:.66rem;padding:.1rem .45rem;border-radius:99px;background:#23264a;color:var(--mut);font-weight:600;}
  .pill.good{background:rgba(62,201,138,.2);color:var(--good);} .pill.bad{background:rgba(224,85,110,.2);color:var(--bad);}
  .pill.warn{background:rgba(224,179,65,.2);color:var(--warn);}
  .item{padding:.75rem .9rem;border-bottom:1px solid var(--line);}
  .item:last-child{border-bottom:none;}
  .who{display:flex;gap:.5rem;align-items:baseline;flex-wrap:wrap;font-size:.9rem;}
  .who b{font-size:.95rem;} .who small{color:var(--mut);}
  .who a{color:var(--accent);text-decoration:none;}
  .tie{font-size:.62rem;padding:.05rem .4rem;border-radius:99px;border:1px solid var(--line);color:var(--mut);}
  .tie.strong{color:var(--good);border-color:var(--good);}
  .rel{font-weight:700;font-variant-numeric:tabular-nums;border-radius:5px;padding:.05rem .35rem;font-size:.75rem;background:#23264a;color:var(--mut);}
  .rel.hi{background:var(--good);color:#0b0c18;} .rel.mid{background:var(--warn);color:#0b0c18;}
  textarea{width:100%;min-height:96px;background:#0c0d1c;border:1px solid var(--line);color:var(--ink);border-radius:8px;
    font:12.5px/1.55 ui-monospace,monospace;padding:.55rem .65rem;margin-top:.45rem;resize:vertical;}
  .acts{display:flex;gap:.45rem;align-items:center;flex-wrap:wrap;margin-top:.45rem;}
  .btn{border:1px solid var(--line);background:#23264a;color:var(--ink);padding:.32rem .7rem;border-radius:8px;cursor:pointer;font-size:.8rem;}
  .btn:hover{border-color:var(--accent);}
  .btn.good{background:var(--good);color:#0b0c18;border-color:var(--good);font-weight:600;}
  .btn.copy{background:var(--accent);color:#0b0c18;border-color:var(--accent);font-weight:600;}
  input[type=date]{background:#0c0d1c;border:1px solid var(--line);color:var(--ink);border-radius:7px;font:inherit;padding:.28rem .45rem;font-size:.8rem;}
  .len{color:var(--mut);font-size:.74rem;} .len.over{color:var(--warn);}
  .empty{color:var(--mut);text-align:center;padding:3rem;background:var(--card);border:1px solid var(--line);border-radius:12px;}
  .banner{display:none;} .banner.show{display:block;padding:.6rem .9rem;border-radius:10px;margin-bottom:.9rem;font-size:.85rem;}
  .banner.warn{background:rgba(224,179,65,.14);border:1px solid var(--warn);color:var(--warn);}
  .banner.bad{background:rgba(224,85,110,.14);border:1px solid var(--bad);color:var(--bad);}
  .banner code{background:#0c0d1c;padding:.05rem .3rem;border-radius:4px;}
  .banner .btn{margin-left:.5rem;}
  .state{font-size:.74rem;color:var(--mut);} .state.saved{color:var(--good);} .state.unsaved{color:var(--bad);font-weight:600;}
  .toast{position:fixed;bottom:1rem;right:1rem;background:var(--good);color:#0b0c18;padding:.5rem .9rem;border-radius:8px;font-weight:600;opacity:0;transition:.2s;} .toast.show{opacity:1;}
</style>
</head>
<body>
<script src="/conn.js"></script>
<header>
  <h1>BYOJB</h1>
  <div class="seg"><a href="/postings">Postings</a><a href="/companies">Companies</a><a href="/outreach">Outreach</a><a href="/plan" class="active">Plan</a><a href="/contacts">Contacts</a><a href="/applications">Applications</a></div>
</header>

<div class="wrap">
  <div class="banner" id="banner"></div>
  <div class="bar" id="bar"></div>
  <div id="days"></div>
</div>

<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>(s??'').toString().replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1400);}
const post=(p,b)=>fetch(p,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)}).then(r=>r.json());
const relBadge=v=>v==null?'':`<span class="rel ${v>=4?'hi':v>=3?'mid':''}">${(+v).toFixed(1).replace(/\.0$/,'')}</span>`;

let PLAN={days:[],total:0};

// ── local-first autosave ────────────────────────────────────────────
// Every edit is written to localStorage SYNCHRONOUSLY before any network call, then pushed to the
// server on a debounce. The dashboard is a plain local process that can die (or be killed) at any
// moment, and losing a message you spent ten minutes wording would be the worst failure this page
// has. localStorage is the source of truth for anything not yet confirmed saved.
const LS_KEY='byojb.plan.pending.v1';
const DEBOUNCE_MS=700;
let PENDING=readPending();          // { key: {draft?, scheduled_for?, at} } — edits not yet ACKed
let timers={}, serverDown=false;

function readPending(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)||'{}'); }catch{ return {}; } }
function writePending(){ try{ localStorage.setItem(LS_KEY,JSON.stringify(PENDING)); }catch{ /* quota/private mode */ } }

// Record locally first — this must never await anything.
function stash(key,patch){
  PENDING[key]={...(PENDING[key]||{}),...patch,at:new Date().toISOString()};
  writePending();
  renderBanner();
}

async function flush(key){
  const p=PENDING[key];
  if(!p) return true;
  const payload={key};
  if(p.draft!==undefined) payload.draft=p.draft;
  if(p.scheduled_for!==undefined) payload.scheduled_for=p.scheduled_for;
  try{
    const r=await post('/api/outreach/draft',payload);
    if(r&&r.error) throw new Error(r.error);
    // Only drop the local copy once the server has confirmed it. If the user typed again while
    // this was in flight, that newer edit has a later `at` and must survive.
    if(PENDING[key]&&PENDING[key].at===p.at){ delete PENDING[key]; writePending(); }
    renderBanner(); markItem(key,'saved');
    return true;
  }catch{
    // conn.js has already raised the top-level bar via the fetch wrapper.
    renderBanner(); markItem(key,'unsaved');
    return false;
  }
}

function queueFlush(key){
  clearTimeout(timers[key]);
  markItem(key,'saving');
  timers[key]=setTimeout(()=>flush(key),DEBOUNCE_MS);
}

async function flushAll(){
  const keys=Object.keys(PENDING);
  let ok=true;
  for(const k of keys) ok=await flush(k)&&ok;
  return ok;
}

function markItem(key,state){
  const el=document.querySelector(`.item[data-k="${CSS.escape(key)}"] [data-state]`);
  if(!el) return;
  el.textContent={saving:'saving…',saved:'saved',unsaved:'unsaved — kept in this browser'}[state]||'';
  el.className='state '+state;
}

// The "server is gone" case is owned by the shared top-level bar (conn.js) so it looks and behaves
// the same on every page. This banner only reports what is unique here: unsaved local edits.
function renderBanner(){
  const n=Object.keys(PENDING).length;
  serverDown=!!(window.BYOJBConn&&window.BYOJBConn.isDown());
  if(window.BYOJBConn){
    window.BYOJBConn.setDetail(n?`${n} edit${n===1?'':'s'} ${n===1?'is':'are'} safe in this browser and will be saved when it returns.`:'');
  }
  const el=$('#banner');
  if(!n||serverDown){ el.className='banner'; el.innerHTML=''; return; }
  el.className='banner show warn';
  el.innerHTML=`${n} edit${n===1?'':'s'} not yet saved to disk. <button class="btn" id="retry">Save now</button>`;
  const b=$('#retry');
  if(b) b.onclick=async()=>{ const ok=await flushAll(); toast(ok?'all edits saved':'still unreachable'); if(ok) await load(); };
}

// When the shared bar detects the server is back, push everything that was held locally.
if(window.BYOJBConn) window.BYOJBConn.onChange(async(isDown)=>{
  serverDown=isDown;
  if(!isDown&&Object.keys(PENDING).length){ if(await flushAll()) await load(); }
  renderBanner();
});

// Last-ditch: try to push anything outstanding when the tab goes away. Not relied upon — the
// localStorage copy is what actually guarantees the text survives.
addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden') flushAll(); });
addEventListener('beforeunload',(e)=>{
  if(Object.keys(PENDING).length){ e.preventDefault(); e.returnValue=''; }
});

async function load(){
  try{
    PLAN=await (await fetch('/api/plan')).json();
  }catch{
    renderBanner();
    if(!PLAN.days.length){
      $('#days').innerHTML='<div class="empty">Can\'t reach the dashboard. Start it with <code>npm run dashboard</code> and reload.<br><br>Any edits you made are still saved in this browser.</div>';
      return;
    }
  }
  render();
}

function dayTitle(d){
  if(d.unscheduled) return `<h2><span>Unscheduled</span><span class="pill warn">${d.count} draft${d.count===1?'':'s'}</span>
    <span style="color:var(--mut);font-weight:400;font-size:.8rem">written but not planned — give them a day</span></h2>`;
  const pretty=new Date(d.date+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric'});
  const tags=[
    `<span class="pill ${d.overdue?'bad':d.today?'good':''}">${d.count} queued</span>`,
    d.today?'<span class="pill good">today</span>':'',
    d.overdue?'<span class="pill bad">overdue</span>':'',
    // Off-day is a nudge, never a block: the whole point of the send-day list is that these
    // mornings convert better, but you may have a good reason to send on a Friday.
    d.off_day&&!d.overdue?`<span class="pill warn">not a usual send day</span>`:'',
  ].filter(Boolean).join('');
  return `<h2><span>${esc(d.weekday)} ${esc(pretty)}</span>${tags}</h2>`;
}

function itemHtml(r){
  return `<div class="item" data-k="${esc(r.key)}">
    <div class="who">
      <b>${esc(r.contact_name)}</b>
      ${r.contact_title?`<small>${esc(r.contact_title)}</small>`:''}
      ${r.company?`<small>· ${esc(r.company)}</small>`:''}
      <span class="tie ${r.strong_tie?'strong':''}">${esc(r.relationship)}</span>
      <span class="pill">${esc(r.archetype)}</span>
      ${relBadge(r.relevance)}
      ${r.activity==='dormant'?'<span class="pill bad" title="rarely on LinkedIn — may never see this">dormant</span>':''}
      <span style="flex:1"></span>
      ${r.linkedin_url?`<a href="${esc(r.linkedin_url)}" target="_blank">LinkedIn ↗</a>`:''}
      ${r.posting_key?`<a href="/posting?key=${encodeURIComponent(r.posting_key)}" target="_blank">${esc(r.posting_title||'posting')} ↗</a>`:''}
    </div>
    <textarea data-draft>${esc(r.draft)}</textarea>
    <div class="acts">
      <button class="btn copy" data-act="copy">Copy</button>
      <button class="btn good" data-act="sent">Mark sent</button>
      <span class="state" data-state></span>
      <span style="flex:1"></span>
      <span class="len" data-len></span>
      <label style="color:var(--mut);font-size:.78rem">send</label>
      <input type="date" data-when value="${esc(r.scheduled_for)}">
    </div>
  </div>`;
}

function render(){
  const sendDays=(PLAN.send_days||[]).join(', ');
  $('#bar').innerHTML=`<span><b>${PLAN.total}</b> prepared message${PLAN.total===1?'':'s'}</span>`
    +`<span>usual send days: <b>${esc(sendDays)}</b></span>`
    +`<span>next slot: <b>${esc(PLAN.next_send_day||'—')}</b></span>`
    +`<span style="color:var(--mut)">write drafts from a posting page, send them yourself here</span>`;

  if(!PLAN.total){
    $('#days').innerHTML='<div class="empty">Nothing prepared yet.<br><br>Open a posting, add a contact under <b>Outreach</b>, and write a draft — it lands here on the next send day.</div>';
    return;
  }
  // Locally-pending edits win over whatever the server returned — they are newer by definition,
  // and may be the only surviving copy if the dashboard died before acking them.
  let restored=0;
  for(const d of PLAN.days) for(const r of d.rows){
    const p=PENDING[r.key];
    if(!p) continue;
    if(p.draft!==undefined&&p.draft!==r.draft){ r.draft=p.draft; restored++; }
    if(p.scheduled_for!==undefined) r.scheduled_for=p.scheduled_for;
  }
  $('#days').innerHTML=PLAN.days.map(d=>
    `<div class="day ${d.today?'today':''} ${d.overdue?'overdue':''}">${dayTitle(d)}${d.rows.map(itemHtml).join('')}</div>`).join('');
  wire();
  renderBanner();
  for(const k of Object.keys(PENDING)) markItem(k,serverDown?'unsaved':'saving');
  if(restored) toast(`restored ${restored} unsaved edit${restored===1?'':'s'} from this browser`);
}

function wire(){
  for(const el of document.querySelectorAll('.item')){
    const key=el.dataset.k;
    const ta=el.querySelector('[data-draft]');
    const lenEl=el.querySelector('[data-len]');
    // The research is explicit that 100–150 words is the target for a cold pitch; show the count
    // so an over-long message is visible before it goes out, without blocking anything.
    const words=()=>ta.value.trim()?ta.value.trim().split(/\s+/).length:0;
    const syncLen=()=>{const w=words();lenEl.textContent=`${w} words`;lenEl.className='len'+(w>170?' over':'');};
    // Autosave: local copy first (synchronous, survives the server dying), server on a debounce.
    ta.oninput=()=>{ syncLen(); stash(key,{draft:ta.value}); queueFlush(key); };
    syncLen();

    el.querySelector('[data-act="copy"]').onclick=async()=>{
      try{ await navigator.clipboard.writeText(ta.value); toast('copied — paste it into LinkedIn'); }
      catch{ ta.select(); document.execCommand('copy'); toast('copied'); }
    };
    el.querySelector('[data-when]').onchange=(e)=>{
      stash(key,{scheduled_for:e.target.value});
      clearTimeout(timers[key]);
      flush(key).then(ok=>{ if(ok){ toast('rescheduled'); load(); } });
    };
    el.querySelector('[data-act="sent"]').onclick=async()=>{
      // Push any in-flight edit first so the logged message is exactly what's on screen, and so a
      // failed save can't be silently discarded by the row disappearing.
      clearTimeout(timers[key]);
      if(PENDING[key]&&!await flush(key)){ toast('save failed — not marking sent'); return; }
      let r;
      try{ r=await post('/api/outreach/sent',{key,body:ta.value}); }
      catch{ renderBanner(); toast('dashboard unreachable'); return; }
      if(r.error){ toast(r.error); return; }
      delete PENDING[key]; writePending();
      toast(`logged as ${r.status}`); await load();
    };
  }
}

load();
</script>
</body>
</html>
