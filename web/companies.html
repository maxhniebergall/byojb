<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Companies — BYOJB</title>
<style>
  :root{--bg:#0f1020;--card:#1a1c33;--ink:#e8e9f3;--mut:#9aa0c0;--line:#2a2d4a;--accent:#7c8cff;--good:#3ec98a;--bad:#e0556e;--warn:#e0b341;}
  *{box-sizing:border-box;} body{margin:0;font:14px/1.5 -apple-system,system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--ink);}
  header{padding:.8rem 1.25rem;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:1rem;flex-wrap:wrap;}
  header h1{font-size:1.05rem;margin:0;} header a.nav{color:var(--accent);text-decoration:none;font-size:.9rem;margin:0 .5rem;}
  .seg{display:flex;gap:.3rem;}
  .seg a{background:none;border:1px solid var(--line);color:var(--ink);padding:.35rem .8rem;border-radius:8px;cursor:pointer;font-size:.85rem;text-decoration:none;}
  .seg a.active{background:var(--accent);border-color:var(--accent);color:#0b0c18;font-weight:600;}
  .wrap{display:grid;grid-template-columns:300px 1fr;gap:1rem;padding:1rem 1.25rem;align-items:start;}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;}
  .pad{padding:.9rem 1rem;} h2.lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:0 0 .7rem;}
  input,select,textarea{background:#0c0d1c;border:1px solid var(--line);color:var(--ink);border-radius:7px;font:inherit;padding:.4rem .5rem;}
  input[type=search]{width:100%;} .ctrls{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;padding:.7rem;border-bottom:1px solid var(--line);}
  .detail{padding:1rem 1.1rem;} .detail.empty{color:var(--mut);text-align:center;padding:3rem;}
  .detail h3{margin:.1rem 0;font-size:1.2rem;} .meta{color:var(--mut);font-size:.83rem;margin:.2rem 0 .8rem;} .meta a{color:var(--accent);text-decoration:none;}
  .badge{font-weight:700;font-variant-numeric:tabular-nums;border-radius:6px;padding:.1rem .35rem;font-size:.82rem;}
  .b-hi{color:#0b0c18;background:var(--good);} .b-mid{color:#0b0c18;background:var(--warn);} .b-lo{background:#23264a;color:var(--mut);}
  .chip{font-size:.66rem;padding:.06rem .4rem;border-radius:99px;background:#23264a;color:var(--mut);margin:0 .15rem .15rem 0;display:inline-block;}
  .pill{font-size:.68rem;padding:.08rem .45rem;border-radius:99px;background:#23264a;color:var(--mut);}
  .dec{font-size:.68rem;padding:.08rem .4rem;border-radius:6px;} .dec.shortlist,.dec.keep{background:rgba(62,201,138,.18);color:var(--good);} .dec.skip{background:rgba(224,85,110,.18);color:var(--bad);}
  .btn{border:1px solid var(--line);background:#23264a;color:var(--ink);padding:.4rem .75rem;border-radius:8px;cursor:pointer;font-size:.83rem;}
  .btn:hover{border-color:var(--accent);} .btn.good{background:var(--good);color:#0b0c18;border-color:var(--good);font-weight:600;} .btn.bad{background:var(--bad);color:#fff;border-color:var(--bad);font-weight:600;} .btn.sm{padding:.25rem .55rem;font-size:.78rem;}
  .list{max-height:80vh;overflow:auto;} .crow{display:flex;gap:.5rem;align-items:center;padding:.5rem .65rem;border-bottom:1px solid var(--line);cursor:pointer;} .crow:hover{background:#191b30;} .crow.sel{background:#23264a;}
  .nm{flex:1;min-width:0;} .nm b{font-weight:600;} .nm small{color:var(--mut);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .field{margin:.8rem 0;} .field label{display:block;font-size:.72rem;text-transform:uppercase;color:var(--mut);margin-bottom:.3rem;}
  textarea{width:100%;min-height:120px;font:12px/1.5 ui-monospace,monospace;}
  .actrow{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;margin:.7rem 0;}
  .toast{position:fixed;bottom:1rem;right:1rem;background:var(--good);color:#0b0c18;padding:.5rem .9rem;border-radius:8px;font-weight:600;opacity:0;transition:.2s;} .toast.show{opacity:1;}
</style>
</head>
<body>
<header>
  <h1>BYOJB</h1>
  <div class="seg"><a href="/postings">Postings</a><a href="/companies" class="active">Companies</a><a href="/outreach">Outreach</a><a href="/contacts">Contacts</a><a href="/applications">Applications</a><a href="/vocabulary">Vocabulary</a></div>
</header>

<div class="wrap">
  <div class="panel">
    <div class="ctrls">
      <button class="btn sm" data-cf="undecided">To decide</button><button class="btn sm" data-cf="keep">Kept</button>
      <button class="btn sm" data-cf="skip">Skipped</button><button class="btn sm" data-cf="all">All</button>
      <input type="search" id="cq" placeholder="filter…" style="flex:1;min-width:120px">
      <select id="csort" title="sort order" style="font-size:.78rem">
        <option value="tier">sort: default (tier)</option>
        <option value="live">sort: live relevant</option>
        <option value="nocomp">sort: missing comp</option>
        <option value="best">sort: best posting score</option>
      </select>
      <button class="btn sm" id="cNeedsComp" title="companies with relevant open postings that state no pay, and no band on record">needs comp</button>
      <button class="btn sm" id="cHasBands" title="companies with pay bands on record">has bands</button>
    </div>
    <div class="list" id="clist"></div>
  </div>
  <div class="panel"><div class="detail empty" id="cdetail">Select a company →</div></div>
</div>

<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>(s??'').toString().replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const bcls=v=>v==null?'b-lo':v>=4?'b-hi':v>=3?'b-mid':'b-lo';
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1300);}
const post=(p,b)=>fetch(p,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)});

// Extract company links (same as in index.html)
function extractLinks(md, name = '') {
  if (!md) return [];
  let urls = [...md.matchAll(/https?:\/\/[^\s,)<>"'\]]+/g)].map(m => m[0].replace(/[.,;)]+$/, ''));
  if (urls.length === 0) {
    const src = (md.match(/^Sources:.*/im) || [''])[0];
    urls = [...src.matchAll(/[a-z0-9-]+(?:\.[a-z0-9-]+)+(?:\/[^\s,]*)?/gi)].map(m => 'https://' + m[0].replace(/[.,;]+$/, ''));
  }
  const host = (u) => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch { return ''; } };
  const mainLabel = (h) => { const p = h.split('.'); return p.length >= 2 ? p[p.length - 2] : h; };
  const nameNorm = name.toLowerCase().replace(/[^a-z0-9]/g, '');
  const isOwn = (u) => { const ml = mainLabel(host(u)); return ml.length >= 3 && nameNorm.length >= 3 && (nameNorm.includes(ml) || ml.includes(nameNorm.slice(0, 8))); };
  let kept = urls.filter(isOwn); if (kept.length === 0) kept = urls;
  const label = (u) => { const s = u.replace(/^https?:\/\//, '').replace(/\/$/, ''); const tag = /career|job/i.test(u) ? 'careers' : /about|values|culture|handbook|life-?at|company/i.test(u) ? 'about' : /blog|engineering/i.test(u) ? 'blog' : ''; return { url: u, label: s.length > 48 ? s.slice(0, 47) + '…' : s, tag }; };
  const seen = new Set();
  return kept.filter(u => !seen.has(u) && seen.add(u)).slice(0, 8).map(label);
}

// ==================== PAY BANDS ====================
// The `derivation` pill is the LEADING visual on every row, because the difference between a
// number the company STATED and one we DERIVED is the most important thing about it.
const money=(n,cur)=>n==null?'—':(cur==='USD'?'US$':cur==='CAD'?'CA$':cur==='GBP'?'£':cur==='EUR'?'€':(cur?cur+' ':'$'))+
  (n>=1000?Math.round(n/1000)+'k':String(n));
function bandRange(b){
  if(!b)return '—';
  const lo=b.min,hi=b.max,cur=b.currency;
  // The high end drops the currency prefix ("CA$164k–197k"); computing it as the difference
  // between the formatted value and the bare number handles any currency, not just the symbols.
  if(lo!=null&&hi!=null&&lo!==hi){
    const hiStr=money(hi,cur), bare=money(hi,null).replace(/^\$/,'');
    return money(lo,cur)+'–'+(hiStr.endsWith(bare)?bare:hiStr);
  }
  return money(b.mid??lo??hi,cur);
}
const DERIV_STYLE={
  direct:{bg:'rgba(62,201,138,.18)',fg:'var(--good)',t:'stated by the company itself'},
  inferred:{bg:'rgba(224,179,65,.18)',fg:'var(--warn)',t:'derived from company-specific evidence'},
  estimated:{bg:'rgba(224,85,110,.15)',fg:'var(--bad)',t:'a model’s prior — no citable source'},
};
function derivPill(d){
  const s=DERIV_STYLE[d]||DERIV_STYLE.estimated;
  return `<span class="pill" style="background:${s.bg};color:${s.fg}" title="${esc(s.t)}">${esc(d||'?')}</span>`;
}
function compBandsHtml(c){
  const rows=c.comp_bands||[],a=c.aggregates||{};
  const summary=[a.live_relevant?`${a.live_relevant} live relevant`:'',
    a.live_relevant_no_comp?`${a.live_relevant_no_comp} without pay info`:'',
    a.best_posting_score!=null?`best posting ${Number(a.best_posting_score).toFixed(2)}`:''].filter(Boolean).join(' · ');
  const table=rows.length?`<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.78rem">
    <tr style="color:var(--mut);text-align:left"><th>role family</th><th>level</th><th>band</th><th>evidence</th><th>src</th><th>conf</th><th>n</th><th>as of</th></tr>
    ${rows.map(r=>`<tr style="border-top:1px solid var(--line)">
      <td>${esc(r.title_family)}</td><td>${esc(r.ladder_level||'—')}</td>
      <td style="font-variant-numeric:tabular-nums;white-space:nowrap">${esc(bandRange(r.band))}${r.band?.component==='base'?' <span style="color:var(--mut)">base</span>':''}</td>
      <td>${derivPill(r.derivation)}</td>
      <td style="color:var(--mut)">${esc(r.provenance?.source||'')}</td>
      <td style="color:var(--mut)">${esc(r.provenance?.confidence||'')}</td>
      <td style="color:var(--mut)">${r.provenance?.sample_size??''}</td>
      <td style="color:var(--mut);white-space:nowrap">${esc(r.provenance?.as_of||'')}</td></tr>
      ${r.derivation!=='direct'&&r.provenance?.method?`<tr><td colspan="8" style="color:var(--mut);font-size:.72rem;padding:0 0 .3rem .2rem">↳ ${esc(r.provenance.method)}${r.provenance?.model?` · model: ${esc(r.provenance.model)}`:''}</td></tr>`:''}`).join('')}
  </table></div>`:`<div style="color:var(--mut);font-size:.82rem">No pay bands on record.${a.live_relevant_no_comp?` ${a.live_relevant_no_comp} relevant posting(s) state no pay — a good comp-research target.`:''}</div>`;
  return `<div class="field"><label>Pay bands ${summary?`<span style="text-transform:none;font-weight:400">— ${esc(summary)}</span>`:''}</label>
    ${table}
    <textarea id="cComp" placeholder="Comp notes for this company (objective / shareable)…" style="min-height:70px;margin-top:.4rem">${esc(c.comp_note||'')}</textarea>
    <button class="btn sm" id="cSaveComp" style="margin-top:.3rem">Save comp note</button></div>`;
}

// ==================== COMPANIES ====================
let CQUEUE=[],cfilter='undecided',csel=null,csort='tier',cNeedsComp=false,cHasBands=false;
async function loadCompanies(){CQUEUE=await (await fetch('/api/companies')).json();renderCList();}
document.querySelectorAll('[data-cf]').forEach(b=>b.onclick=()=>{cfilter=b.dataset.cf;renderCList();});
$('#cq').oninput=renderCList;
$('#csort').onchange=()=>{csort=$('#csort').value;renderCList();};
$('#cNeedsComp').onclick=()=>{cNeedsComp=!cNeedsComp;if(cNeedsComp)cHasBands=false;syncCompBtns();renderCList();};
$('#cHasBands').onclick=()=>{cHasBands=!cHasBands;if(cHasBands)cNeedsComp=false;syncCompBtns();renderCList();};
function syncCompBtns(){
  $('#cNeedsComp').style.borderColor=cNeedsComp?'var(--accent)':'var(--line)';
  $('#cHasBands').style.borderColor=cHasBands?'var(--accent)':'var(--line)';
}
// The server's default ordering (tier → score → relevance) stays the authority on "what next";
// these are alternate lenses, applied client-side only.
const CSORTS={
  tier:null,   // keep the server order
  live:(a,b)=>(b.live_relevant-a.live_relevant),
  nocomp:(a,b)=>(b.live_relevant_no_comp-a.live_relevant_no_comp)||((b.best_posting_score??0)-(a.best_posting_score??0)),
  best:(a,b)=>((b.best_posting_score??-1)-(a.best_posting_score??-1)),
};
function renderCList(){
  const q=$('#cq').value.trim().toLowerCase();
  let list=CQUEUE.filter(r=>cfilter==='all'?true:r.decision===cfilter);
  if(q)list=list.filter(r=>(r.name+r.company_type+r.reason).toLowerCase().includes(q));
  if(cNeedsComp)list=list.filter(r=>r.live_relevant_no_comp>0&&r.comp_band_rows===0);
  if(cHasBands)list=list.filter(r=>r.comp_band_rows>0);
  const cmp=CSORTS[csort]; if(cmp)list=[...list].sort(cmp);
  $('#clist').innerHTML=list.map(r=>{
    const sig=[r.live_relevant?`${r.live_relevant} live`:'',r.live_relevant_no_comp?`${r.live_relevant_no_comp} no-comp`:'',
               r.best_posting_score!=null?`best ${Number(r.best_posting_score).toFixed(1)}`:''].filter(Boolean).join(' · ');
    return `<div class="crow ${csel===r.key?'sel':''}" data-k="${esc(r.key)}">
    <span class="badge ${bcls(r.score)}">${r.score!=null?Number(r.score).toFixed(1):'·'}</span>
    <span class="nm"><b>${esc(r.name)}</b><small>${esc(r.provider)} · ${r.remote_relevant??'?'} remote${sig?' · '+esc(sig):''}${r.reason?' · '+esc(r.reason):''}</small></span>
    ${r.comp_band_rows?`<span class="pill" title="${r.comp_band_rows} pay band(s) on record">💰${r.comp_band_rows}</span>`:''}
    <span class="pill">${esc(r.company_type)}</span>${r.decision!=='undecided'?`<span class="dec ${r.decision}">${r.decision}</span>`:''}</div>`;
  }).join('')||'<div class="detail empty">nothing here</div>';
  $('#clist').querySelectorAll('.crow').forEach(el=>el.onclick=()=>openCompany(el.dataset.k));
}
async function openCompany(key){
  csel=key;renderCList();
  const c=await (await fetch('/api/company?key='+encodeURIComponent(key))).json();
  $('#cdetail').className='detail';
  $('#cdetail').innerHTML=`<h3>${esc(c.name)} ${c.decision!=='undecided'?`<span class="dec ${c.decision}">${c.decision}</span>`:''}</h3>
    <div class="meta">${esc(c.provider)} · ${esc(c.company_type||'')} · ${c.remote_relevant??'?'} remote-eligible ${c.careers_url?`· <a href="${esc(c.careers_url)}" target="_blank">careers ↗</a>`:''}${c.links&&c.links.length?' · '+c.links.map(l=>`<a style="color:var(--accent)" href="${esc(l.url)}" target="_blank">${l.tag?'['+esc(l.tag)+'] ':''}${esc(l.label)} ↗</a>`).join(' '):''}</div>
    <div style="margin:.3rem 0">${(c.sample_titles||[]).map(t=>`<span class="chip">${esc(t)}</span>`).join('')}</div>
    <div class="actrow"><label style="font-size:.78rem;color:var(--mut)">Rank 0–5:</label><input id="cRank" type="number" min="0" max="5" step="0.1" value="${c.llm_fit??c.llm_rank??''}" style="width:5rem"><button class="btn sm" id="cSaveRank">Save</button><span style="flex:1"></span><button class="btn good" id="cKeep">Keep</button><button class="btn bad" id="cSkip">Skip</button><button class="btn sm" id="cUndo">Reset</button></div>
    ${compBandsHtml(c)}
    <div class="field"><label>Fit verdict</label><textarea id="cFit">${esc(c.fit_verdict)}</textarea><button class="btn sm" id="cSaveFit" style="margin-top:.3rem">Save fit</button></div>
    <div class="field"><label>Research note</label><textarea id="cRes">${esc(c.research_note)}</textarea><button class="btn sm" id="cSaveRes" style="margin-top:.3rem">Save note</button></div>`;
  $('#cKeep').onclick=async()=>{await post('/api/company/decision',{key,decision:'keep'});toast('kept');await loadCompanies();openCompany(key);};
  $('#cSkip').onclick=async()=>{await post('/api/company/decision',{key,decision:'skip'});toast('skipped');await loadCompanies();openCompany(key);};
  $('#cUndo').onclick=async()=>{await post('/api/company/decision',{key,decision:'undecided'});toast('reset');await loadCompanies();openCompany(key);};
  $('#cSaveRank').onclick=async()=>{const r=await post('/api/company/rank',{key,llm_fit:$('#cRank').value});toast((await r.json()).ok?'rank saved':'0–5 only');await loadCompanies();};
  $('#cSaveFit').onclick=async()=>{await post('/api/company/report',{key,which:'fit',content:$('#cFit').value});toast('fit saved');};
  $('#cSaveRes').onclick=async()=>{await post('/api/company/report',{key,which:'research',content:$('#cRes').value});toast('note saved');};
  $('#cSaveComp').onclick=async()=>{await post('/api/company/comp',{key,note:$('#cComp').value});toast('comp note saved');};
}

loadCompanies();

// Check if a company key was passed via query param (from posting JIT-vet)
const params = new URLSearchParams(window.location.search);
const vetKey = params.get('vet');
if (vetKey) {
  setTimeout(() => openCompany(vetKey), 300);
}
</script>
</body>
</html>
